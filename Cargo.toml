[workspace]
members = [
    "crates/poly",
    "crates/poly-core",
    "crates/poly-config",
    "crates/poly-resolver",
    "crates/poly-rust",
    "crates/poly-c",
    "crates/poly-go",
    "crates/poly-linker",
    "crates/poly-vfsx",
    "crates/poly-registry",
    "crates/poly-package",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/axiomwtf/poly"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
# Error handling
anyhow = "1.0"
thiserror = "1.0"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# TOML parsing (cargo/go-mod migration)
toml = "0.8"
# Time
chrono = "0.4"
# SAT solver
rsat = "0.1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI
clap = { version = "4.5", features = ["derive"] }
# Filesystem
walkdir = "2.5"
glob = "0.3"
sha2 = "0.10"
