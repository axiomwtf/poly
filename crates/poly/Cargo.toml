[package]
name = "poly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "poly"
path = "src/main.rs"

[dependencies]
poly-core = { path = "../poly-core" }
poly-config = { path = "../poly-config" }
poly-resolver = { path = "../poly-resolver" }
poly-rust = { path = "../poly-rust" }
poly-c = { path = "../poly-c" }
poly-go = { path = "../poly-go" }
poly-linker = { path = "../poly-linker" }
poly-vfsx = { path = "../poly-vfsx" }
poly-registry = { path = "../poly-registry" }
poly-package = { path = "../poly-package" }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
glob = { workspace = true }
walkdir = { workspace = true }
dirs = "5.0"
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["json", "multipart"] }
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
hex = "0.4"
rpassword = "7"
