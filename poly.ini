[project]
name = poly
version = 0.1.0
edition = 2024
description = "Polyglot build system and package manager for Rust, C/C++, and Go"
license = MPL-2.0
repository = https://github.com/axiomwtf/poly
keywords = build-system, package-manager, polyglot
categories = development-tools

[workspace]
members = poly-cli, poly-core, poly-config, poly-resolver, poly-rust, poly-c, poly-go, poly-linker, poly-vfsx, poly-registry, poly-package
sharedDeps = tokio, anyhow, thiserror, serde, serde_json, chrono, tracing, tracing-subscriber, clap, walkdir, glob, sha2

[target.poly-cli]
language = rust
type = bin
sources = crates/poly-cli/src/main.rs
edition = 2024

[target.poly-core]
language = rust
type = lib
sources = crates/poly-core/src/lib.rs
edition = 2024

[target.poly-config]
language = rust
type = lib
sources = crates/poly-config/src/lib.rs
edition = 2024

[target.poly-resolver]
language = rust
type = lib
sources = crates/poly-resolver/src/lib.rs
edition = 2024

[target.poly-rust]
language = rust
type = lib
sources = crates/poly-rust/src/lib.rs
edition = 2024

[target.poly-c]
language = rust
type = lib
sources = crates/poly-c/src/lib.rs
edition = 2024

[target.poly-go]
language = rust
type = lib
sources = crates/poly-go/src/lib.rs
edition = 2024

[target.poly-linker]
language = rust
type = lib
sources = crates/poly-linker/src/lib.rs
edition = 2024

[target.poly-vfsx]
language = rust
type = lib
sources = crates/poly-vfsx/src/lib.rs
edition = 2024

[target.poly-registry]
language = rust
type = lib
sources = crates/poly-registry/src/lib.rs
edition = 2024

[target.poly-package]
language = rust
type = lib
sources = crates/poly-package/src/lib.rs
edition = 2024

[dependencies.rust]
tokio = 1.40|full
anyhow = 1.0
thiserror = 1.0
serde = 1.0|derive
serde_json = 1.0
chrono = 0.4
tracing = 0.1
tracing-subscriber = 0.3|env-filter
clap = 4.5|derive
walkdir = 2.5
glob = 0.3
sha2 = 0.10
reqwest = 0.12|json
tar = 0.4
xz2 = 0.1
ed25519-dalek = 2.0
hex = 0.4
rand = 0.8
rand_core = 0.6
dirs = 5.0
rpassword = 7
flate2 = 1.0
regex = 1.10
nom = 7.1

[dependencies.workspace.poly-cli]
poly-core = path
poly-config = path
poly-resolver = path
poly-rust = path
poly-c = path
poly-go = path
poly-linker = path
poly-vfsx = path
poly-registry = path
poly-package = path

[dependencies.workspace.poly-core]
poly-registry = path

[dependencies.workspace.poly-linker]
poly-rust = path
poly-c = path
poly-go = path

[dependencies.workspace.poly-package]
poly-vfsx = path

[build.default]
targets = rust:poly-registry, rust:poly-config, rust:poly-resolver, rust:poly-rust, rust:poly-c, rust:poly-go, rust:poly-vfsx, rust:poly-core, rust:poly-linker, rust:poly-package, rust:poly-cli

[publish]
crateName = axiom-poly
targets = rust:poly-registry, rust:poly-config, rust:poly-resolver, rust:poly-rust, rust:poly-c, rust:poly-go, rust:poly-vfsx, rust:poly-core, rust:poly-linker, rust:poly-package, rust:poly-cli
platforms = x86_64-linux, x86_64-windows
includeDocs = false
